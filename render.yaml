services:
  # ----------------------------------------------------
  # 1. FastAPI Backend (WebSockets + API)
  # ----------------------------------------------------
  - type: web
    name: anonymous-chat-backend
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_NAME
        value: e2ee_anonymous_chat
      - key: CORS_ORIGINS
        value: "*"
      - key: MONGODB_URL
        sync: false

  # ----------------------------------------------------
  # 2. React Native Web / Expo Frontend (Static Site CDN)
  # ----------------------------------------------------
  - type: static
    name: anonymous-chat-frontend
    plan: free
    buildCommand: cd frontend && npm install && npx expo export --platform web
    staticPublishPath: frontend/dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: EXPO_PUBLIC_API_URL
        sync: false
